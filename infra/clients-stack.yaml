AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PT Studio client database - trainees and their health profiles, as two
  physically separate tables. Payers stay in the invoicing table (CUSTOMER
  items); a trainee points at its payer through payer_id. This stack never
  touches the invoicing table.

Parameters:
  InvoicingTableName:
    Type: String
    Description: Name of the existing invoicing table (the value of $INVOICING_TABLE). Only used to scope a read-only permission.

Resources:

  # One item per person who trains. trainee_id is the SAME uuid PT Studio uses
  # as client_id, so bronze/silver/gold data already lines up with it.
  # payer_id = the sk of a CUSTOMER item in the invoicing table. DynamoDB can't
  # enforce a foreign key, so the API layer must check the payer exists on write.
  TraineesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: pt-trainees
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: trainee_id, AttributeType: S }
        - { AttributeName: payer_id,   AttributeType: S }
      KeySchema:
        - { AttributeName: trainee_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by_payer          # "all trainees for this payer" (one parent, several children)
          KeySchema:
            - { AttributeName: payer_id,   KeyType: HASH }
            - { AttributeName: trainee_id, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  # Special-category (health) data kept apart so it can have tighter access,
  # its own retention and its own erasure path. Same key as the trainee.
  HealthProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: pt-health-profiles
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: trainee_id, AttributeType: S }
      KeySchema:
        - { AttributeName: trainee_id, KeyType: HASH }

  # ---- Juniors (under-18s): consent log, consent links, growth measurements ----
  # Read and written only by the juniors Lambdas in template.yaml. PT Studio's
  # sync policy below deliberately has no access to them.

  # Append-only consent log. sk = "<consent_type>#<granted_at>". Withdrawal stamps
  # withdrawn_at on the row; rows are never deleted by the app (audit trail).
  JuniorConsentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: pt-junior-consents
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: trainee_id, AttributeType: S }
        - { AttributeName: sk,         AttributeType: S }
      KeySchema:
        - { AttributeName: trainee_id, KeyType: HASH }
        - { AttributeName: sk,         KeyType: RANGE }

  # Single-use links emailed to parents. Keyed by the SHA-256 of the token (the
  # token itself is never stored); TTL removes rows 14 days after issue.
  JuniorConsentRequestsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: pt-junior-consent-requests
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: token_hash, AttributeType: S }
        - { AttributeName: trainee_id, AttributeType: S }
      KeySchema:
        - { AttributeName: token_hash, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by_trainee        # "links sent for this child that are still open"
          KeySchema:
            - { AttributeName: trainee_id, KeyType: HASH }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [sent_at, sent_to, expires_at]
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Monthly measurements: sk = "<measured_on>#<measurement_id>" so a query returns
  # visits in date order. One extra item per junior, sk = "PROFILE", holds the
  # mid-parent height. All of a junior's growth data is in one partition.
  GrowthMeasurementsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: pt-growth-measurements
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: trainee_id, AttributeType: S }
        - { AttributeName: sk,         AttributeType: S }
      KeySchema:
        - { AttributeName: trainee_id, KeyType: HASH }
        - { AttributeName: sk,         KeyType: RANGE }

  # What PT Studio's sync is allowed to do - nothing more. Attach it to the
  # pt-uploader permission set in IAM Identity Center as a customer managed policy
  # named PtStudioSync. No delete (erasure is an admin action), and the invoicing
  # table can only be queried inside the CUSTOMER partition: invoices, emails and
  # the counter are unreadable and nothing there is writable.
  SyncPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: PtStudioSync
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ClientTables
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Scan]
            Resource:
              - !GetAtt TraineesTable.Arn
              - !GetAtt HealthProfilesTable.Arn
          - Sid: ReadPayersOnly
            Effect: Allow
            Action: dynamodb:Query
            Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InvoicingTableName}"
            Condition:
              ForAllValues:StringEquals:
                "dynamodb:LeadingKeys": [CUSTOMER]

Outputs:
  TraineesTableName:
    Value: !Ref TraineesTable
  HealthProfilesTableName:
    Value: !Ref HealthProfilesTable
  SyncPolicyName:
    Value: !Ref SyncPolicy
  JuniorConsentsTableName:
    Value: !Ref JuniorConsentsTable
  JuniorConsentRequestsTableName:
    Value: !Ref JuniorConsentRequestsTable
  GrowthMeasurementsTableName:
    Value: !Ref GrowthMeasurementsTable
